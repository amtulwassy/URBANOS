<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>URBANOS — Urban Flood Early Warning &amp; Response System</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/login.css" />
</head>
<body>

<div class="login-shell">

  <div class="login-bg" aria-hidden="true">
    <img class="login-bg-img" src="assets/login-bg.jpg" alt="" />
  </div>
  <h1 class="sr-only">URBANOS — Urban Flood Early Warning &amp; Response System. Predict. Prevent. Protected.</h1>

  <div class="login-right">
    <div class="login-form-wrap">
      <div class="login-form-head">
        <h2>Welcome to URBANOS</h2>
        <p class="text-muted">Log in to access your dashboard</p>
        <div class="head-underline"></div>
      </div>

      <div class="role-toggle" role="tablist">
        <button class="role-card" data-role="authority" id="tab-authority" role="tab" aria-selected="true">
          <span class="role-icon">🏛️</span>
          <strong>Authority Login</strong>
          <span class="role-sub">For Government &amp; Municipal Officials</span>
        </button>
        <button class="role-card" data-role="citizen" id="tab-citizen" role="tab" aria-selected="false">
          <span class="role-icon">👤</span>
          <strong>User Login</strong>
          <span class="role-sub">For Citizens</span>
        </button>
      </div>

      <form id="login-form">
        <div class="field input-icon-field">
          <label for="email">Email ID / Username</label>
          <span class="field-icon">✉️</span>
          <input class="input" id="email" type="text" placeholder="you@example.com" autocomplete="username" />
        </div>
        <div class="field input-icon-field">
          <label for="password">Password</label>
          <span class="field-icon">🔒</span>
          <input class="input" id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="field-eye" id="toggle-password" aria-label="Show password">👁️</button>
        </div>

        <div class="flex justify-between items-center" style="margin-bottom:18px;">
          <label class="text-sm text-muted flex items-center gap-6" style="cursor:pointer;">
            <input type="checkbox" id="remember" checked /> Remember me
          </label>
          <a href="#" class="text-sm" id="forgot-link" style="color:var(--blue-600); font-weight:700;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Login →</button>
      </form>

      <div class="or-divider"><span>OR</span></div>

      <button class="btn btn-outline btn-block" id="google-btn">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>

      <p class="register-line">Don't have an account? <a href="#" id="register-link">Register Now</a></p>

      <p class="secure-footer">🛡️ Secure &nbsp;|&nbsp; Reliable &nbsp;|&nbsp; For a Safer Tomorrow</p>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/locations.js"></script>
<script src="js/ui-common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
